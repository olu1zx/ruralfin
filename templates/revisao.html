<!-- Mesmo editor para notas extraídas, criação manual e edição de contas. -->
<section class="card editor hidden" id="notaEditor" aria-labelledby="editorTitulo">
  <h2 id="editorTitulo">Revisar dados da nota</h2>
  <p class="hint">Confira os dados antes de lançar. Se o PDF não informar um campo, preencha-o aqui.</p>
  <form id="notaForm">
    <div class="grid">
      <div><label for="notaTipo">Tipo da conta</label><select id="notaTipo"><option value="APAGAR">A pagar (despesa)</option><option value="ARECEBER">A receber (receita)</option></select></div>
      <div><label for="notaNumero">Número da nota / documento</label><input id="notaNumero" maxlength="60" required></div>
      <div><label for="notaEmissao">Data de emissão</label><input type="date" id="notaEmissao" required></div>
      <div><label for="notaTotal">Valor total (R$)</label><input type="number" id="notaTotal" min="0.01" step="0.01" required></div>
      <div class="full"><label for="notaDescricao">Descrição dos produtos / serviços</label><textarea id="notaDescricao" maxlength="10000"></textarea></div>
    </div>
    <h3 id="pessoaTitulo">Fornecedor</h3>
    <div class="grid">
      <div><label for="notaRazao">Nome / razão social</label><input id="notaRazao" maxlength="200" required></div>
      <div><label for="notaFantasia">Nome fantasia</label><input id="notaFantasia" maxlength="200"></div>
      <div class="full"><label for="notaCnpj">CPF/CNPJ do fornecedor ou cliente</label><input id="notaCnpj" maxlength="18" required></div>
    </div>
    <h3>Faturado</h3>
    <div class="grid">
      <div><label for="notaNome">Nome completo</label><input id="notaNome" maxlength="200" required></div>
      <div><label for="notaCpf">CPF</label><input id="notaCpf" maxlength="14" required></div>
    </div>
    <h3>Classificações</h3>
    <label for="notaCategorias">Uma classificação por linha</label>
    <textarea id="notaCategorias" required placeholder="MANUTENÇÃO E OPERAÇÃO"></textarea>
    <h3>Parcelas</h3>
    <div id="notaParcelas"></div>
    <button type="button" id="adicionarParcela">+ Adicionar parcela</button>
    <div class="actions">
      <button class="primary" type="submit" id="analisarBtn">Consultar no banco</button>
      <button type="button" id="cancelarNota">Cancelar</button>
    </div>
  </form>
  <div id="consultaResultado" class="check-rows hidden" aria-live="polite"></div>
  <div class="actions hidden" id="lancarActions"><button class="primary" type="button" id="lancarBtn">Confirmar e lançar conta</button></div>
  <div id="notaStatus" class="status" role="status" aria-live="polite"></div>
</section>
