<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar - RuralFin</title><link rel="stylesheet" href="/static/comum.css"></head><body><main class="wrap" style="max-width:460px"><header class="marca"><h1>RuralFin</h1><p>Controle financeiro rural</p></header><section class="card"><h2>Entrar no sistema</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username" required><br><br><label for="senha">Senha</label><input type="password" id="senha" name="senha" autocomplete="current-password" required><div class="actions"><button class="primary">Entrar</button></div>{% if erro %}<p class="status err" role="alert">{{ erro }}</p>{% endif %}</form></section></main></body></html>
